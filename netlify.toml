# Netlify builds and serves the website, workspace and studio (static files).
# The backend is hosted separately (Render, see docs/DEPLOYMENT.md). VITE_API_URL is its
# address; a value set in the Netlify dashboard overrides this one.
[build]
  base = "frontend"
  command = "npm ci --no-fund --no-audit && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://autevra.onrender.com"

# Client-side routes (/app, /studio/:projectId/:workspace, /platform/...).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
