[project]
name = "autevra"
version = "0.1.0"
description = "Autevra backend: parametric automotive CAD driven by validated commands"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Utkarsh Mehta" }]
dependencies = [
    "cadquery==2.8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "numpy>=2.0",
    "httpx2>=2.13",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autevra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cad: builds real B-rep geometry (slower)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
