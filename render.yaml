# Render Blueprint for the backend API (see docs/DEPLOYMENT.md).
# "free": 512 MB, 0.1 CPU, sleeps after 15 minutes without traffic; no payment card.
# CI runs the backend inside those limits (docker job). For more speed, "starter" or
# "standard" give more CPU.
services:
  - type: web
    name: autevra-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTEVRA_DATABASE_URL
        sync: false # the Neon connection string, entered in the dashboard
      - key: AUTEVRA_CORS_ORIGINS
        sync: false # e.g. ["https://autevra.netlify.app"]
      - key: AUTEVRA_LLM_PROVIDER
        value: "off"
      - key: AUTEVRA_DATA_DIR
        value: /tmp/autevra
