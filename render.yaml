# Render Blueprint for the backend API (optional; see docs/DEPLOYMENT.md).
# The backend uses ~300 MiB in the container after a model build (more during studies,
# not yet measured), so the 512 MB plans are too tight to rely on; "standard" is 2 GB.
services:
  - type: web
    name: autevra-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTEVRA_DATABASE_URL
        sync: false # the Neon connection string, entered in the dashboard
      - key: AUTEVRA_CORS_ORIGINS
        sync: false # e.g. ["https://autevra.netlify.app"]
      - key: AUTEVRA_LLM_PROVIDER
        value: "off"
      - key: AUTEVRA_DATA_DIR
        value: /tmp/autevra
