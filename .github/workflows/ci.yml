name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for OCP/VTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxrender1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  backend-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autevra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      AUTEVRA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/autevra_test
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for OCP/VTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libxrender1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-24.04
    needs: [backend, backend-postgres, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Backend image serves on $PORT
        run: |
          docker build -t autevra-api backend
          docker run -d --name api -p 9000:9000 -e PORT=9000 -e AUTEVRA_LLM_PROVIDER=off autevra-api
          for i in $(seq 1 45); do
            curl -fsS http://localhost:9000/api/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
      - name: Backend works within Render's free instance (512 MB, 0.1 CPU)
        timeout-minutes: 25
        run: |
          docker run -d --name small --memory 512m --memory-swap 512m --cpus 0.1 \
            -p 8100:8000 -e AUTEVRA_LLM_PROVIDER=off autevra-api
          start=$(date +%s)
          for i in $(seq 1 120); do curl -fsS http://localhost:8100/api/health >/dev/null && break; sleep 2; done
          echo "ready after $(( $(date +%s) - start )) s"
          start=$(date +%s)
          deploy/smoke.sh http://localhost:8100
          echo "smoke test took $(( $(date +%s) - start )) s"
          echo "peak memory: $(docker exec small cat /sys/fs/cgroup/memory.peak) bytes"
          test "$(docker inspect -f '{{.State.OOMKilled}}' small)" = false
      - name: Hugging Face Space bundle builds and works as uid 1000
        run: |
          deploy/huggingface/build-space.sh "$RUNNER_TEMP/space"
          docker build -t autevra-space "$RUNNER_TEMP/space"
          docker run -d --name space -p 8000:8000 autevra-space
          for i in $(seq 1 45); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          test "$(docker exec space id -u)" = 1000
          id=$(curl -fsS -X POST -H 'content-type: application/json' -d '{"name":"ci"}' \
            http://localhost:8000/api/projects | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -o /dev/null http://localhost:8000/api/projects/$id/model
          curl -fsS -o model.step http://localhost:8000/api/projects/$id/export.step
          head -c 13 model.step | grep -q ISO-10303-21
          curl -fsS http://localhost:8000/api/llm | grep -q '"provider":"off"'
          docker stats --no-stream space
