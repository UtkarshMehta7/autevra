name: Deploy backend to Hugging Face Spaces

# Pushes backend/ to the Space after CI passes on main. Needs, in the GitHub repository
# settings: secret HF_TOKEN (a Hugging Face token with write access) and variable
# HF_SPACE (the Space id, e.g. "your-name/autevra-api"). Without them the job is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Assemble the Space
        run: deploy/huggingface/build-space.sh "$RUNNER_TEMP/space"
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN secret is not set"; exit 1; }
          cd "$RUNNER_TEMP/space"
          git init -q -b main
          git add -A
          git -c user.name="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%an)" \
              -c user.email="$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ae)" \
              commit -q -m "Deploy ${SOURCE_SHA}"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
